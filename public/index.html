<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/tablogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soph's Space</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="home-page">
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>
    <div class="app">

      <nav class="navbar">
        <div class="nav-left">
          <h1>> Soph's Space</h1>
        </div>
        <div class="nav-right">
          <a href="/" class="nav-button">Home</a>
          <a href="/projects/" class="nav-button">Projects</a>
          <a href="/blog/" class="nav-button">Blog</a>
        </div>

        <div class="hamburger" onclick="toggleMobileMenu()">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </div>

        <div class="mobile-nav-menu">
          <a href="/" class="mobile-nav-button">Home</a>
          <a href="/projects/" class="mobile-nav-button">Projects</a>
          <a href="/blog/" class="mobile-nav-button">Blog</a>
        </div>
      </nav>

      <main class="main-content">
        <h1>Welcome to..</h1>
        <img src="/nobgdark.svg" alt="Logo of Sophs.Space" class="center-logo">
      </main>
      <footer class="footer">
        <div class="footer-left">
          <p> &copy; 2026 Soph's Space</p>
        </div>
        <div class="footer-right">
          <p>Something here..</p>
        </div>
      </footer>
    </div>
    
    <script>
      function showTab(tabId) {
        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        
        tabButtons.forEach(button => button.classList.remove('active'));
        tabContents.forEach(content => content.classList.remove('active'));
        
        event.target.classList.add('active');
        
        document.getElementById(tabId).classList.add('active');
      }
      
      function toggleMobileMenu() {
        const hamburger = document.querySelector('.hamburger');
        const mobileMenu = document.querySelector('.mobile-nav-menu');
        
        hamburger.classList.toggle('active');
        mobileMenu.classList.toggle('active');
      }
      
      document.addEventListener('DOMContentLoaded', function() {
        const mobileNavButtons = document.querySelectorAll('.mobile-nav-button');
        mobileNavButtons.forEach(button => {
          button.addEventListener('click', function() {
            const hamburger = document.querySelector('.hamburger');
            const mobileMenu = document.querySelector('.mobile-nav-menu');
            hamburger.classList.remove('active');
            mobileMenu.classList.remove('active');
          });
        });
      });
    </script>
    <script src="/stars.js"></script>
  </body>
</html>
